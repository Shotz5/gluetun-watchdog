services:
  gluetun-watchdog:
    build: ./gluetun-watchdog
    image: gluetun-watchdog:local
    restart: unless-stopped
    extra_hosts:
      - portainer.akitsul.dev:192.168.50.104
    environment:
      - PIA_USER=p1111221
      - PIA_PASS=${PIA_PASS}
      - PIA_REGION=ca_vancouver
      - PORTAINER_URL=https://portainer.akitsul.dev
      - PORTAINER_API_KEY=${PORTAINER_API_KEY}
      - PORTAINER_STACK_ID=7
      - PORTAINER_ENDPOINT_ID=3
      - GLUETUN_SERVICE=gluetun
      - DEPENDENT_SERVICES=qbittorrent autobrr
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  pia-wg-config:
    build: ./pia-wg-config
    image: pia-wg-config:local
    # Only here so the stack builds the image the watchdog runs.
    # Starts, exits immediately, and stays stopped.
    entrypoint: ["true"]
    restart: "no"

